            <article class="card" data-category="Outerwear">

    <script type="module">
      import * as THREE from 'three';
      import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
      import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

      const canvasWrap = document.querySelector('.canvas-wrap');
      const canvas = document.getElementById('human-canvas');

      if (window.location.protocol === 'file:') {
        console.warn('Open this page from a local web server (for example: python -m http.server) because file:// URLs block FBX loading in most browsers.');
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xCBCED1);

      const camera = new THREE.PerspectiveCamera(35, canvasWrap.clientWidth / canvasWrap.clientHeight, 0.1, 1000);
      camera.position.set(0, 2.1, 6.4);
      camera.lookAt(0, 1.6, 0);

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(canvasWrap.clientWidth, canvasWrap.clientHeight, false);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
      keyLight.position.set(3, 6, 5);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xcfe6ff, 0.8);
      fillLight.position.set(-4, 2, -3);
      scene.add(fillLight);

      const human = new THREE.Group();
      scene.add(human);

      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(3.5, 64),
        new THREE.MeshStandardMaterial({ color: 0xd9d9d9, roughness: 1 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0;
      scene.add(floor);

      const resizeRenderer = () => {
        const width = canvasWrap.clientWidth;
        const height = canvasWrap.clientHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
      };

      resizeRenderer();
      window.addEventListener('resize', resizeRenderer);

      let isDragging = false;
      let lastX = 0;
      let lastY = 0;

      canvas.addEventListener('pointerdown', (event) => {
        isDragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
        canvas.setPointerCapture(event.pointerId);
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!isDragging) return;

        const deltaX = event.clientX - lastX;
        const deltaY = event.clientY - lastY;

        human.rotation.y += deltaX * 0.01;
        human.rotation.x += deltaY * 0.01;

        lastX = event.clientX;
        lastY = event.clientY;
      });

      canvas.addEventListener('pointerup', () => {
        isDragging = false;
      });

      canvas.addEventListener('pointerleave', () => {
        isDragging = false;
      });

      const hat = new THREE.Group();
      hat.visible = false;
      human.add(hat);

      window.__fashionState = { hat, human, camera, renderer, selectedModel: 'male' };

      const applyLook = (lookName) => {
        if (lookName === 'hat') {
          hat.visible = true;
        } else {
          hat.visible = false;
        }
      };

      const firstCardButton = document.querySelectorAll('.card-button')[0];
      firstCardButton?.addEventListener('click', () => {
        const isOn = firstCardButton.dataset.active === 'true';
        const nextState = !isOn;

        firstCardButton.dataset.active = String(nextState);
        firstCardButton.textContent = nextState ? 'Remove' : 'Try it out';
        firstCardButton.classList.toggle('card-button--active', nextState);
        applyLook(nextState ? 'hat' : 'none');
      });

      const loader = new FBXLoader();
      loader.setPath('./3d/');
      loader.setResourcePath('./3d/textures/');
      const parseFbx = loader.parse.bind(loader);
      loader.parse = (buffer, path) => {
        const previousFileName = Object.getOwnPropertyDescriptor(Object.prototype, 'FileName');
        Object.defineProperty(Object.prototype, 'FileName', { configurable: true, value: '' });

        try {
          return parseFbx(buffer, path);
        } finally {
          if (previousFileName) {
            Object.defineProperty(Object.prototype, 'FileName', previousFileName);
          } else {
            delete Object.prototype.FileName;
          }
        }
      };

      loader.load(
        'Style human.fbx',
        (object) => {
          object.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;

              const materials = Array.isArray(child.material) ? child.material : [child.material];
              materials.forEach((material) => {
                material.opacity = 1;
                material.transparent = false;
                material.needsUpdate = true;
              });
            }
          });

          human.add(object);
          object.rotation.set(Math.PI / 2, 0, 0);
          object.scale.setScalar(1);
          object.position.set(0, 0, 0);
          human.updateMatrixWorld(true);

          object.traverse((child) => {
            if (child.isSkinnedMesh) {
              child.skeleton.update();
            }
          });

          const posedBounds = new THREE.Box3();
          const vertex = new THREE.Vector3();

          object.traverse((child) => {
            const positions = child.geometry?.attributes.position;
            if (!child.isMesh || !positions) return;

            for (let index = 0; index < positions.count; index += 1) {
              if (child.isSkinnedMesh) {
                child.getVertexPosition(index, vertex);
              } else {
                vertex.fromBufferAttribute(positions, index);
              }

              posedBounds.expandByPoint(child.localToWorld(vertex));
            }
          });

          const posedSize = posedBounds.getSize(new THREE.Vector3());
          const posedCenter = posedBounds.getCenter(new THREE.Vector3());
          const modelScale = 3.2 / posedSize.y;

          object.scale.setScalar(modelScale);
          object.position.set(
            -posedCenter.x * modelScale,
            -posedBounds.min.y * modelScale,
            -posedCenter.z * modelScale
          );

          human.rotation.y = 0;
          human.position.y = 0;

          window.__fashionState.model = object;
          window.__fashionState.modelLoaded = true;

          const capLoader = new OBJLoader();
          capLoader.load(
            './3d/obj+BASE+BALL+CAP.obj',
            (cap) => {
              const capBounds = new THREE.Box3().setFromObject(cap);
              const capSize = capBounds.getSize(new THREE.Vector3());
              const capCenter = capBounds.getCenter(new THREE.Vector3());
              const capScale = 0.36 / capSize.x;

              cap.scale.setScalar(capScale);
              cap.position.set(
                -0.024 - capCenter.x * capScale,
                3.05 - capBounds.min.y * capScale,
                0.057 - capCenter.z * capScale
              );

              const capTextureLoader = new THREE.TextureLoader();
              const capBaseColor = capTextureLoader.load('./3d/textures/body/base%20color.png');
              capBaseColor.colorSpace = THREE.SRGBColorSpace;

              const capMaterial = new THREE.MeshStandardMaterial({
                map: capBaseColor,
                normalMap: capTextureLoader.load('./3d/textures/body/normal.png'),
                roughnessMap: capTextureLoader.load('./3d/textures/body/rougness.png'),
                metalnessMap: capTextureLoader.load('./3d/textures/body/metallic.png'),
                roughness: 0.8
              });
              cap.traverse((child) => {
                if (child.isMesh) {
                  child.material = capMaterial;
                  child.castShadow = true;
                  child.receiveShadow = true;
                }
              });

              hat.add(cap);
              window.__fashionState.cap = cap;
              window.__fashionState.capLoaded = true;
            },
            undefined,
            (error) => {
              console.error('Could not load baseball cap OBJ:', error);
            }
          );
        },
        (progress) => {
          console.log('FBX loading', (progress.loaded / progress.total) * 100 + '%');
        },
        (error) => {
          console.error('Could not load FBX model:', error);
        }
      );

      const animate = () => {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      };

      animate();

      const modelButtons = document.querySelectorAll('.model-switch__button');
      modelButtons.forEach((button) => {
        button.addEventListener('click', () => {
          modelButtons.forEach((option) => {
            const isSelected = option === button;
            option.classList.toggle('is-active', isSelected);
            option.setAttribute('aria-pressed', String(isSelected));
          });

          window.__fashionState.selectedModel = button.dataset.model;
        });
      });

      const tabs = document.querySelectorAll('.tab');
      const cards = document.querySelectorAll('.card');

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          const selectedCategory = tab.dataset.category;

          tabs.forEach((btn) => {
            const isActive = btn === tab;
            btn.classList.toggle('active', isActive);
            btn.setAttribute('aria-selected', String(isActive));
          });

          cards.forEach((card) => {
            const matches = selectedCategory === 'all' || card.dataset.category === selectedCategory;
            card.classList.toggle('hidden', !matches);
          });
        });
      });
    </script>

    <style>
      * {
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f3;
        color: #111;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 30px 30px 3px 30px;
        padding: 16px 32px;
        background-color: #CBCED1;
        border: 3px solid #E4E7EA;
        box-shadow: 0px 0px 0px 3px #8E9398;
        border-radius: 6px;
      }

      .title {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .nav-button {
        position: relative;
        color: #111;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        padding: 7px 18px;
        
        border-radius: 6px;
        font-weight: bold;
        &:nth-child(1){
            background-color: #6CD0CF;
            border: 3px solid #B9E8E9;
            box-shadow: 0px 0px 0px 3px #4E9496;
        }
        &:nth-child(2){
            background-color: #F48AD1;
            border: 3px solid #F7C8EA;
            box-shadow: 0px 0px 0px 3px #AA6498;
        }
        &:nth-child(3){
            background-color: #CCC7EA;
            border: 3px solid #E5E4F6;
            box-shadow: 0px 0px 0px 3px #8F8EA9;
        }
        &:nth-child(4){
            background-color: #FDB755;
            border: 3px solid #FBDCB2;
            box-shadow: 0px 0px 0px 3px #B08343;
        }
      }

      .nav-button:hover {
        opacity: 0.7;
      }

      .divider-left {
        margin-left: 18px;
      }

        content: "";
        position: absolute;
        left: -23px;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 46px;
        background: rgba(17, 17, 17, 0.5);
        border-radius: 3px;
      }

      .layout {
        display: grid;
        grid-template-columns: 1.15fr 1.35fr;
        min-height: calc(100vh - 86px);
      }

      .viewer-panel {
        padding: 30px;
      }

      .model-switch {
        display: flex;
        gap: 16px;
        padding-bottom: 12px;
      }

      .model-switch__button {
        color: #111;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        padding: 7px 18px;
        background-color: #CBCED1;
        border: 3px solid #E4E7EA;
        box-shadow: 0px 0px 0px 3px #8E9398;
        border-radius: 6px;
        font-weight: bold;
      }

      .model-switch__button.is-active {
        background-color: #6CD0CF;
        border-color: #B9E8E9;
        box-shadow: 0px 0px 0px 3px #4E9496;
      }

      .canvas-wrap {
        position: relative;
        width: 100%;
        height: 650px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #CBCED1;
        border: 3px solid #E4E7EA;
        box-shadow: 0px 0px 0px 3px #8E9398;
        border-radius: 6px;
        overflow: hidden;
      }

      #human-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .catalog-panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: #f7f5f1;
      }

      .tab-row {
        display: flex;
        gap: 16px;
        padding: 30px 22px 12px;
        flex-wrap: wrap;
        overflow: hidden;
      }

      .tab {
        position: relative;
        color: #111;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        padding: 7px 18px;
        background-color: #CBCED1;
        border: 3px solid #E4E7EA;
        box-shadow: 0px 0px 0px 3px #8E9398;
        border-radius: 6px;
        font-weight: bold;
      }

      .tab.active {

        box-shadow: 0px 0px 0px 3px #4E9496;
      }

      }

      .card-scroll-wrap::after {

      }

        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 18px;
        padding: 22px;
        overflow-y: auto;
        max-height: 600px;
        height: 100%;
      }

        display: none;

        border: 3px solid #E4E7EA;

      }

        height: 160px;

      .image-one { background: #6CD0CF; border: 3px solid #4E9496; }
      .image-two { background: #6CD0CF; border: 3px solid #4E9496; }
      .image-three { background: #6CD0CF; border: 3px solid #4E9496; }
      .image-four { background: #6CD0CF; border: 3px solid #4E9496; }
      .image-five { background: #6CD0CF; border: 3px solid #4E9496; }
      .image-six { background: #6CD0CF; border: 3px solid #4E9496; }
      .image-seven { background: #6CD0CF; border: 3px solid #4E9496; }
      .image-eight { background: #6CD0CF; border: 3px solid #4E9496; }
      .image-nine { background: #6CD0CF; border: 3px solid #4E9496; }

        flex-direction: column;
        gap: 10px;
        padding: 14px 12px 18px;

        display: inline-block;

        color: #111;
        font-size: 0.7rem;

        }

        }

      }
